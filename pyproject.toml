[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "panelpop"
version = "0.1.0a3"
description = "Local Windows client-area panels and guarded phone clicks"
readme = "README.en.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "PanelPop contributors" }]
dependencies = ["Pillow>=10.4,<13", "qrcode>=8,<9"]
keywords = ["windows", "screen-sharing", "remote-control", "lan", "smartphone"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/anpanmanj987-hub/PanelPop"
Issues = "https://github.com/anpanmanj987-hub/PanelPop/issues"
Changelog = "https://github.com/anpanmanj987-hub/PanelPop/blob/main/CHANGELOG.md"

[project.scripts]
panelpop = "panelpop.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
panelpop = ["static/*.html", "static/*.css", "static/*.js"]
